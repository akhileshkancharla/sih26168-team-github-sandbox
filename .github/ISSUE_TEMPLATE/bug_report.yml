name: Sandbox bug report
description: Report a reproducible problem in the training repository
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Exact reproduction steps
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant error output with secrets removed
      render: shell
    validations:
      required: true
